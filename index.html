// Pick empiric drug — for discrepancy/escalate cases force a resistant choice
function pickEmpiricDrug(organism, caseType, susceptMap) {
  const candidates = EMPIRIC_DRUG_FOR[organism] || ["TMP-SMX","Ciprofloxacin"];
  if (caseType === "cleared") {
    // pick one that IS susceptible
    const good = candidates.filter(d => (susceptMap[d]||0) >= 70);
    return good[0] || candidates[0];
  } else {
    // pick one that IS resistant (low/zero susceptibility)
    const bad = candidates.filter(d => (susceptMap[d]||0) < 50);
    return bad[0] || candidates[candidates.length-1];
  }
}

function rnd(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function rndInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function seededId(i){ return `PT-${String(10000+i).padStart(5,'0')}`; }

function buildSusceptMap(organism, caseType) {
  // Build a realistic MIC panel for the culture report
  const abx = ANTIBIOGRAMS.stanford.organisms[organism] || {};
  const drugs = Object.keys(abx);
  return drugs.map(drug => {
    const pct = abx[drug];
    let interp;
    if (pct >= 80) interp = "S";
    else if (pct >= 50) interp = Math.random()>0.4?"S":"I";
    else if (pct >= 20) interp = Math.random()>0.5?"I":"R";
    else interp = "R";
    const micVals = { "S":["<=0.25","<=0.5","<=1","<=2"], "I":["4","8","16"], "R":[">=32",">=64",">=128"] };
    const mic = rnd(micVals[interp]);
    return { drug, mic, interpretation: interp };
  });
}

function hasPyeloContext(ctx) {
  const kw = ["flank pain","fever","CVA tenderness","pyelonephritis","nausea","vomiting","rigors","chills","back pain","systemically ill","costovertebral"];

}

    ...Array(6).fill("ESBL E. coli"),
    ...Array(5).fill("ESBL Klebsiella"),
    ...Array(3).fill("CRE Klebsiella"),
    ...Array(4).fill("Pseudomonas aeruginosa"),
    ...Array(3).fill("MDR Pseudomonas"),
  ];

  const usedNames = new Set();

  for (let i=0;i<count;i++){
    const caseType = typeMap[i];
    let organism;
    if (caseType==="mdro") {
      organism = rnd(["MRSA","VRE (E. faecium)","ESBL E. coli","ESBL Klebsiella","CRE Klebsiella","MDR Pseudomonas"]);
    } else if (caseType==="pyelo") {
      organism = rnd(["E. coli","Klebsiella pneumoniae","Proteus mirabilis","ESBL E. coli","Pseudomonas aeruginosa"]);
    } else {
      organism = rnd(orgPool);
    }

    const oMeta = ORGANISM_META[organism] || { gram:"Unknown", isMDRO:false };
    const susceptibilities = buildSusceptMap(organism, caseType);
    const susceptMap = {};
    susceptibilities.forEach(s=>{ susceptMap[s.drug]=ANTIBIOGRAMS.stanford.organisms[organism]?.[s.drug]||0; });

    const isDiscrepancy = caseType==="discrepancy";
    const isPyelo = caseType==="pyelo";
    const isMDRO = caseType==="mdro" || oMeta.isMDRO;

    let activeDrug = pickEmpiricDrug(organism, (isDiscrepancy||isPyelo||isMDRO)?"discrepancy":"cleared", susceptMap);

    // Sometimes a cleared case has wrong drug but still susceptible — that's fine
    const age = rndInt(18,92);
    const sex = Math.random()>0.35?"F":"M";

    // Generate unique name
    let fname,lname,nameKey;
    do {
      fname=rnd(FIRST_NAMES); lname=rnd(LAST_NAMES);
      nameKey=`${fname}${lname}`;
    } while(usedNames.has(nameKey));
    usedNames.add(nameKey);

    // Random allergies (0-2)
    const numAllergies = Math.random()<0.5?0:Math.random()<0.6?1:2;
    const allergies = [];
    const allergyPool = [...ALLERGIES_POOL];
    for(let j=0;j<numAllergies;j++){
      const idx=rndInt(0,allergyPool.length-1);
      allergies.push(allergyPool.splice(idx,1)[0]);
    }

    const dob = new Date(2026-age, rndInt(0,11), rndInt(1,28));
    const colDaysAgo = rndInt(1,3);
    const collectedAt = new Date(Date.now()-colDaysAgo*86400000-rndInt(2,8)*3600000);
    const finalizedAt = new Date(collectedAt.getTime()+rndInt(24,48)*3600000);

    const uaWBC = (isDiscrepancy||isPyelo||isMDRO)? rnd([">100","50-100","25-50"]) : rnd(["10-25",">100","5-10"]);
    const uaBact = (isDiscrepancy||isPyelo||isMDRO)? rnd(["Many","Moderate"]) : rnd(["Many","Moderate","Few"]);
    const uaNitrite = organism.includes("Enterococcus")||organism.includes("MRSA")||organism.includes("VRE")?"-":rnd(["+","+","+"," -"]);
    const uaLE = (isPyelo||isMDRO)? rnd(["3+","3+","2+"]) : rnd(["2+","3+","1+"]);

    // Status logic
    let status, escalateReasons=[];
    const abxData = ANTIBIOGRAMS.stanford.organisms[organism]||{};
    const activeDrugPct = abxData[activeDrug]||0;
    const isCultureResistant = activeDrugPct < 50;

    if (caseType==="cleared" && !isMDRO) {
      status = "cleared";
    } else if (isPyelo) {
      status = "escalate";
      escalateReasons.push("Pyelonephritis / upper tract involvement");
      if (isMDRO||oMeta.isMDRO) escalateReasons.push("MDRO organism");
    } else if (isMDRO||oMeta.isMDRO) {
      status = "escalate";
      escalateReasons.push("MDRO organism — "+organism);
      // Check if all susceptible options are IV only
      const susceptDrugs = Object.entries(abxData)
        .filter(([d,pct])=>pct>=70)
        .map(([d])=>d);
      const allIV = susceptDrugs.length===0 || susceptDrugs.every(d=>(DRUG_META[d]||{}).route==="IV");
      if(allIV) escalateReasons.push("No oral antibiotic options available — IV therapy required");
    } else if (isDiscrepancy && isCultureResistant) {
      status = "discrepancy";
    } else {
      status = "cleared";
    }

    // Allergy conflicts with prescribing
    allergies.forEach(al => {
      const drugClass = (DRUG_META[activeDrug]||{}).class||"";
      const alCross = ALLERGY_CROSS[al.substance.toLowerCase()]||[];
      if(alCross.includes(drugClass) && al.severity==="severe/anaphylaxis") {
        if(status!=="escalate") { status="escalate"; escalateReasons.push(`Allergy conflict: ${al.substance} (anaphylaxis) vs. ${activeDrug}`); }
        else escalateReasons.push(`Allergy conflict: ${al.substance} (anaphylaxis)`);
      }
    });

    const clinicalContext = buildClinicalContext(organism, caseType, age, sex==="F"?"female":"male");

    patients.push({
      id: seededId(i),
      mrn: `MRN${String(2000000+i*37+13).slice(0,7)}`,
      name: { first:fname, last:lname },
      dob: dob.toISOString().slice(0,10),
      age, sex,
      room: rnd(ROOMS),
      provider: rnd(PROVIDERS),
      allergies,
      activeMedication: {
        drug: activeDrug,
        dose: (DRUG_META[activeDrug]||{}).doseStd || "500mg BID",
        route: (DRUG_META[activeDrug]||{}).route || "PO",
        prescribedAt: new Date(collectedAt.getTime()-rndInt(6,24)*3600000).toISOString(),
        indication: "Empiric UTI",
      },
      urinalysis: {
        color: rnd(["Yellow","Dark yellow","Amber","Cloudy yellow"]),
        clarity: rnd(["Cloudy","Turbid","Hazy"]),
        wbc: uaWBC+" cells/hpf",
        rbc: rnd(["0-2","2-5","5-10"])+" cells/hpf",
        bacteria: uaBact,
        nitrite: uaNitrite,
        leukocyteEsterase: uaLE,
        squamousEpithelialCells: rnd(["<2/hpf","None","<5/hpf"]),
        pH: rnd(["5.5","6.0","6.5","7.0"]),
        specificGravity: `1.0${rndInt(10,30)}`,
        glucose: "Negative", protein: rnd(["Negative","Trace"]),
      },
      culture: {
        specimenType: rnd(["Clean catch midstream","Clean catch midstream","Catheter"]),
        collectedAt: collectedAt.toISOString(),
        finalizedAt: finalizedAt.toISOString(),
        colonyCount: rnd([">100,000 CFU/mL",">100,000 CFU/mL","50,000–100,000 CFU/mL"]),
        organism,
        gramStain: oMeta.gram,
        susceptibilities,
        isMDRO: isMDRO||oMeta.isMDRO,
      },
      clinicalContext,
      status,
      escalateReasons,
      requiresAdmission: escalateReasons.some(r=>r.includes("IV therapy required")||r.includes("No oral")),
      actionTaken: null,
    });
  }
  return patients;
}

// ─── DECISION ENGINE ─────────────────────────────────────────────────────────
function getAllergyClasses(allergies) {
  const classes = new Set();
  allergies.forEach(al => {
    const sub = al.substance.toLowerCase();
    if(al.severity==="severe/anaphylaxis" || al.severity==="moderate") {
      Object.entries(ALLERGY_CROSS).forEach(([cls,drugs])=>{
        if(sub.includes(cls)||cls.includes(sub)) classes.add(cls);
      });
      // Direct name matches
      if(sub.includes("penicillin")||sub.includes("amoxicillin")||sub.includes("ampicillin")) {
        classes.add("penicillin");
        if(al.severity==="severe/anaphylaxis") classes.add("cephalosporin"); // cross-reactivity
      }
      if(sub.includes("sulfa")||sub.includes("trimethoprim")||sub.includes("tmp")) classes.add("sulfa");
      if(sub.includes("cipro")||sub.includes("fluoroquinolone")||sub.includes("levo")) classes.add("fluoroquinolone");
      if(sub.includes("cephalexin")||sub.includes("ceph")) classes.add("cephalosporin");
      if(sub.includes("nitrofurantoin")) classes.add("nitrofuran");
      if(sub.includes("doxycycline")||sub.includes("tetracycline")) classes.add("tetracycline");
      if(sub.includes("vancomycin")) classes.add("glycopeptide");
    }
  });
  return classes;
}

function analyzePatient(patient, institution) {
  const gram = ANTIBIOGRAMS[institution]?.organisms || {};
  const { organism, susceptibilities, isMDRO } = patient.culture;
  const activeDrug = patient.activeMedication.drug;
  const allergyClasses = getAllergyClasses(patient.allergies);

  // Culture susceptibility for active drug
  const cultureResult = susceptibilities.find(s=>s.drug===activeDrug);
  const cultureInterp = cultureResult?.interpretation || "?";
  const isResistant = cultureInterp === "R" || cultureInterp === "I";

  // Antibiogram-based recommendations
  const orgGram = gram[organism] || {};
  const recs = Object.entries(orgGram)
    .filter(([drug]) => drug !== activeDrug)
    .map(([drug, pct]) => {
      const meta = DRUG_META[drug] || {};
      const isAllergyConflict = allergyClasses.has(meta.class);
      return { drug, susceptPct: pct, route: meta.route||"PO", class: meta.class, narrow: meta.narrow||5, dose: meta.doseStd||"", indication: meta.indication||"", isAllergyConflict };
    })
    .filter(r => r.susceptPct >= 60 && !r.isAllergyConflict)
    .sort((a,b) => a.narrow - b.narrow || b.susceptPct - a.susceptPct);

  const allSusceptible = Object.entries(orgGram)
    .filter(([d,pct])=>pct>=60)
    .map(([d])=>d);
  const oralOptions = allSusceptible.filter(d=>(DRUG_META[d]||{}).route==="PO");
  const requiresAdmission = oralOptions.length===0 && allSusceptible.length>0;

  const isPyelo = hasPyeloContext(patient.clinicalContext);

  let status = patient.status;
  let escalateReasons = [...patient.escalateReasons];
  if(requiresAdmission && !escalateReasons.some(r=>r.includes("oral"))) {
    escalateReasons.push("No oral antibiotic options available — IV therapy required");
  }

  return {
    cultureInterp,
    isResistant,
    isPyelo,
    isMDRO,
    requiresAdmission,
    recommendations: recs.slice(0,5),
    topRec: recs[0],
    status,
    escalateReasons,
    allergyClasses: Array.from(allergyClasses),
  };
}

const StatusBadge = ({ status, small }) => {

    cleared:           { bg:"bg-green-100", text:"text-green-800", border:"border-green-300", label:"Cleared" },

    pending:           { bg:"bg-gray-100",  text:"text-gray-600",  border:"border-gray-300",  label:"Pending Culture" },
    reviewed:          { bg:"bg-blue-100",  text:"text-blue-800",  border:"border-blue-300",  label:"Reviewed" },
  };
  const c = configs[status] || configs.pending;
  const sz = small ? "text-xs px-1.5 py-0.5" : "text-xs px-2 py-1 font-semibold";

const AllergyChip = ({ allergy }) => {
  const colors = { "severe/anaphylaxis":"bg-red-100 text-red-800 border-red-300", moderate:"bg-orange-100 text-orange-800 border-orange-300", mild:"bg-yellow-100 text-yellow-800 border-yellow-300" };
  return <span className={`inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded border font-medium ${colors[allergy.severity]||"bg-gray-100 text-gray-700 border-gray-300"}`}>

};

function fmtDate(iso) {
  if(!iso) return "";
  return new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function fmtDateTime(iso) {
  if(!iso) return "";
  return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}

    </div>

    {/* Tabs */}
    <div className="flex border-b bg-gray-50">
      {tabs.map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)}
          className={`px-5 py-3 text-sm font-medium border-b-2 transition-colors ${tab===t.id?"border-blue-600 text-blue-700 bg-white":"border-transparent text-gray-600 hover:text-gray-800 hover:bg-white"}`}>
          {t.label}
        </button>
      ))}
    </div>

    <div className="flex-1 overflow-y-auto scrollbar-thin">
      {/* Meds Tab */}
      {tab==="meds" && (
        <div className="p-5 space-y-4">
          <div className="rounded-xl border border-gray-200 overflow-hidden">
            <div className="bg-gray-50 px-4 py-2.5 border-b flex items-center gap-2">
              <span className="text-sm font-semibold text-gray-700">Active Medications — EPIC</span>
              <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">Live</span>
            </div>
            <table className="w-full text-sm">
              <thead className="bg-gray-50 text-xs text-gray-500 uppercase">
                <tr><th className="px-4 py-2 text-left">Medication</th><th className="px-4 py-2 text-left">Dose / Route</th><th className="px-4 py-2 text-left">Indication</th><th className="px-4 py-2 text-left">Ordered</th></tr>
              </thead>
              <tbody>
                <tr className={`border-t ${status==="discrepancy"||status==="escalate"?"bg-red-50":status==="cleared"?"bg-green-50":""}`}>
                  <td className="px-4 py-3 font-semibold">{patient.activeMedication.drug}</td>
                  <td className="px-4 py-3 text-gray-700">{patient.activeMedication.dose} {patient.activeMedication.route}</td>
                  <td className="px-4 py-3 text-gray-600">{patient.activeMedication.indication}</td>
                  <td className="px-4 py-3 text-gray-500 text-xs">{fmtDateTime(patient.activeMedication.prescribedAt)}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl">
            <div className="text-sm font-semibold text-blue-800 mb-2">Clinical Context / Workup Summary</div>
            <p className="text-sm text-blue-900 leading-relaxed">{patient.clinicalContext}</p>
          </div>
        </div>
      )}

      {/* UA Tab */}
      {tab==="ua" && (
        <div className="p-5">
          <div className="rounded-xl border border-gray-200 overflow-hidden">
            <div className="bg-gray-50 px-4 py-2.5 border-b text-sm font-semibold text-gray-700">Urinalysis Results</div>
            <div className="grid grid-cols-2 divide-x divide-y divide-gray-100">
              {[
                ["Color", patient.urinalysis.color],
                ["Clarity", patient.urinalysis.clarity],
                ["pH", patient.urinalysis.pH],
                ["Specific Gravity", patient.urinalysis.specificGravity],
                ["WBC", patient.urinalysis.wbc],
                ["RBC", patient.urinalysis.rbc],
                ["Bacteria", patient.urinalysis.bacteria],
                ["Nitrite", patient.urinalysis.nitrite],
                ["Leukocyte Esterase", patient.urinalysis.leukocyteEsterase],
                ["Squamous Epithelial Cells", patient.urinalysis.squamousEpithelialCells],
                ["Glucose", patient.urinalysis.glucose],
                ["Protein", patient.urinalysis.protein],
              ].map(([label,val])=>(
                <div key={label} className="px-4 py-2.5 flex justify-between items-center">
                  <span className="text-xs text-gray-500">{label}</span>
                  <span className={`text-sm font-medium ${(val==="Many"||val==="3+"||val==="+"||val?.includes(">100"))?"text-red-700":""}`}>{val}</span>
                </div>
              ))}
            </div>
          </div>
          {analysis.isPyelo && (
            <div className="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-800">
              <strong>⚠ Pyelonephritis Flags:</strong> Clinical context includes systemic symptoms (fever, flank pain, CVA tenderness). UA and culture consistent with upper tract infection.
            </div>
          )}
        </div>
      )}

      {/* Culture Tab */}
      {tab==="culture" && (
        <div className="p-5 space-y-4">
          <div className="grid grid-cols-2 gap-4">
            {[
              ["Organism", patient.culture.organism],
              ["Gram Stain", patient.culture.gramStain],
              ["Colony Count", patient.culture.colonyCount],
              ["Specimen Type", patient.culture.specimenType],
              ["Collected", fmtDateTime(patient.culture.collectedAt)],
              ["Finalized", fmtDateTime(patient.culture.finalizedAt)],
            ].map(([k,v])=>(
              <div key={k} className="bg-gray-50 rounded-lg p-3 border border-gray-200">
                <div className="text-xs text-gray-500 uppercase tracking-wide">{k}</div>
                <div className={`text-sm font-semibold mt-0.5 ${k==="Organism"?"italic text-gray-900":""}`}>{v}</div>
              </div>
            ))}
          </div>

          <div className="rounded-xl border border-gray-200 overflow-hidden">
            <div className="bg-gray-50 px-4 py-2.5 border-b text-sm font-semibold text-gray-700">Susceptibility Panel (MIC)</div>
            <table className="w-full text-sm">
              <thead className="text-xs text-gray-500 uppercase bg-gray-50 border-b">
                <tr><th className="px-4 py-2 text-left">Antibiotic</th><th className="px-4 py-2 text-center">MIC</th><th className="px-4 py-2 text-center">Interpretation</th><th className="px-4 py-2 text-center">Route</th></tr>
              </thead>
              <tbody className="divide-y divide-gray-100">
                {patient.culture.susceptibilities.map((s,i) => {
                  const isActive = s.drug===patient.activeMedication.drug;
                  const rowBg = isActive ? (s.interpretation==="R"?"bg-red-50":s.interpretation==="I"?"bg-yellow-50":"bg-green-50") : "";
                  return <tr key={i} className={`${rowBg} ${isActive?"font-bold border-l-4 "+( s.interpretation==="R"?"border-l-red-500":s.interpretation==="I"?"border-l-yellow-500":"border-l-green-500"):""}`}>
                    <td className="px-4 py-2.5">{s.drug}{isActive&&<span className="ml-2 text-xs bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded">Active Rx</span>}</td>
                    <td className="px-4 py-2.5 text-center font-mono text-gray-700">{s.mic}</td>
                    <td className="px-4 py-2.5 text-center">
                      <span className={`px-2 py-0.5 rounded-full text-xs font-bold ${s.interpretation==="S"?"bg-green-100 text-green-800":s.interpretation==="I"?"bg-yellow-100 text-yellow-800":"bg-red-100 text-red-800"}`}>{s.interpretation==="S"?"Susceptible":s.interpretation==="I"?"Intermediate":"Resistant"}</span>
                    </td>
                    <td className="px-4 py-2.5 text-center text-xs text-gray-500">{(DRUG_META[s.drug]||{}).route||"PO"}</td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>

    {/* AI Decision Panel */}
    <div className={`border-t ${analysis.requiresAdmission?"bg-amber-50 border-amber-200":analysis.isResistant||analysis.isPyelo||analysis.isMDRO?"bg-red-50 border-red-200":"bg-green-50 border-green-200"} p-4`}>
      {/* Alert Banner */}
      {!patient.actionTaken && (analysis.isResistant||analysis.isPyelo||analysis.isMDRO) && (
        <div className={`mb-3 p-3 rounded-lg border ${analysis.requiresAdmission?"bg-amber-100 border-amber-300":"bg-red-100 border-red-300"}`}>
          <div className={`text-sm font-bold ${analysis.requiresAdmission?"text-amber-900":"text-red-900"}`}>
            {analysis.requiresAdmission ? "⚠ Likely Admission Required — No Oral Options Available" :
             analysis.isPyelo ? "⚠ Pyelonephritis / Upper Tract Involvement Detected" :
             analysis.isMDRO ? "⚠ MDRO Organism — Escalation Required" :
             "⚠ Culture Resistance Discrepancy"}
          </div>
          <div className={`text-xs mt-0.5 ${analysis.requiresAdmission?"text-amber-800":"text-red-800"}`}>
            {analysis.requiresAdmission ? `${patient.culture.organism} has no susceptible oral antibiotics. Patient requires IV therapy — escalate to MD and consider patient callback for admission.` :
             analysis.isPyelo ? "Clinical presentation consistent with upper tract infection. IV antibiotics and possible admission indicated — MD review required." :
             analysis.isMDRO ? `${patient.culture.organism} is a multidrug-resistant organism. Standard protocol prescribing is not available.` :
             `${patient.activeMedication.drug} is reported Resistant. Culture-guided therapy change recommended.`}
          </div>
        </div>
      )}
      {patient.actionTaken && (
        <div className="mb-3 p-3 bg-green-100 border border-green-300 rounded-lg text-sm text-green-800 font-semibold">
          ✓ {patient.actionTaken.type==="changed" ? `Rx changed to ${patient.actionTaken.drug}` : "Escalated to MD"} — {fmtDateTime(patient.actionTaken.timestamp)}
        </div>
      )}

      {/* Recommendations */}
      {!patient.actionTaken && analysis.recommendations.length>0 && (
        <div className="mb-3">
          <div className="text-xs font-semibold text-gray-600 uppercase tracking-wide mb-2">
            AI Recommendation — {ANTIBIOGRAMS[institution].name}
          </div>
          <div className="flex gap-2 flex-wrap">
            {analysis.recommendations.slice(0,3).map((rec,i)=>(
              <div key={rec.drug} className="bg-white rounded-lg border border-gray-200 p-3 flex-1 min-w-[160px] shadow-sm">
                <div className="flex items-center gap-1.5 mb-1">
                  <span className="text-xs text-gray-400 font-bold">#{i+1}</span>
                  <span className="text-sm font-bold text-gray-900">{rec.drug}</span>
                  <span className={`ml-auto text-xs px-1.5 py-0.5 rounded-full font-bold ${rec.susceptPct>=90?"bg-green-100 text-green-800":rec.susceptPct>=75?"bg-blue-100 text-blue-800":"bg-yellow-100 text-yellow-800"}`}>{rec.susceptPct}%S</span>
                </div>
                <div className="text-xs text-gray-500">{rec.dose}</div>
                <span className={`text-xs px-1.5 py-0.5 rounded mt-1 inline-block ${rec.route==="IV"?"bg-purple-100 text-purple-700":"bg-gray-100 text-gray-600"}`}>{rec.route}</span>
                {rec.indication && <div className="text-xs text-amber-700 mt-1">⚠ {rec.indication}</div>}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Action Buttons */}
      {!patient.actionTaken && (
        <div className="flex gap-3">
          <button
            onClick={()=>setShowChangeRx(true)}
            disabled={!canChangeRx}
            title={!canChangeRx?"Requires MD review — escalate instead":"Change antibiotic per protocol"}
            className={`flex-1 py-2.5 px-4 rounded-lg text-sm font-semibold transition-all ${canChangeRx?"bg-blue-600 hover:bg-blue-700 text-white shadow":"bg-gray-200 text-gray-400 cursor-not-allowed"}`}>
            💊 Change Rx (Protocol)
          </button>
          <button
            onClick={()=>setShowEscalate(true)}
            className={`flex-1 py-2.5 px-4 rounded-lg text-sm font-semibold transition-all text-white shadow ${analysis.requiresAdmission||analysis.isPyelo?"bg-amber-600 hover:bg-amber-700 pulse-amber":"bg-orange-600 hover:bg-orange-700"} ${mustEscalate?"ring-2 ring-offset-1 ring-orange-400":""}`}>
            📞 Escalate to MD
          </button>
        </div>
      )}
      {status==="cleared" && !patient.actionTaken && (
        <div className="flex items-center gap-3">
          <div className="flex-1 p-2.5 bg-green-100 border border-green-300 rounded-lg text-sm text-green-800 font-medium text-center">
            ✓ Empiric therapy confirmed susceptible — no action required
          </div>
          <button onClick={()=>onAction(patient.id,"reviewed",null,null)} className="px-4 py-2.5 bg-green-600 hover:bg-green-700 text-white text-sm font-semibold rounded-lg">
            Mark Reviewed
          </button>
        </div>
      )}
    </div>

    {showChangeRx && <ChangeRxModal patient={patient} analysis={analysis} onConfirm={(drug,note)=>{ onAction(patient.id,"changed",drug,note); setShowChangeRx(false); }} onClose={()=>setShowChangeRx(false)} />}
    {showEscalate && <EscalateModal patient={patient} analysis={analysis} onConfirm={(sbar)=>{ onAction(patient.id,"escalated",null,Object.values(sbar).join("\n\n")); setShowEscalate(false); }} onClose={()=>setShowEscalate(false)} />}
  </div>;
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
const ALL_PATIENTS = generatePatients(120);
const BATCH_SIZE = 15;

function App() {
  const [institution, setInstitution] = useState("stanford");
  const [patients, setPatients] = useState(ALL_PATIENTS.slice(0,BATCH_SIZE));
  const [batchIndex, setBatchIndex] = useState(1);
  const [selectedId, setSelectedId] = useState(ALL_PATIENTS[0].id);
  const [filterStatus, setFilterStatus] = useState("all");
  const [showLoadMore, setShowLoadMore] = useState(false);
  const [customAntibiogram, setCustomAntibiogram] = useState(null);
  const fileRef = useRef();

  const selectedPatient = patients.find(p=>p.id===selectedId);

  const handleAction = useCallback((id, type, drug, note) => {
    setPatients(prev => prev.map(p => p.id===id ? { ...p, actionTaken:{ type, drug, note, timestamp:new Date().toISOString() } } : p));
  }, []);

  // Check if all action-required cases are resolved
  useEffect(()=>{
    const active = patients.filter(p=>
      (p.status==="discrepancy"||p.status==="escalate") && !p.actionTaken
    );
    setShowLoadMore(active.length===0 && batchIndex*BATCH_SIZE<ALL_PATIENTS.length);
  },[patients, batchIndex]);

  function loadNextBatch() {
    const next = ALL_PATIENTS.slice(batchIndex*BATCH_SIZE, (batchIndex+1)*BATCH_SIZE);
    setPatients(prev=>[...prev, ...next]);
    setBatchIndex(b=>b+1);
    setShowLoadMore(false);
    if(next.length>0) setSelectedId(next[0].id);
  }

  const effectiveInstitution = customAntibiogram ? "custom" : institution;

  // Stats
  const stats = useMemo(()=>{
    const actionRequired = patients.filter(p=>(p.status==="discrepancy"||p.status==="escalate")&&!p.actionTaken).length;
    const cleared = patients.filter(p=>p.status==="cleared"||p.actionTaken?.type==="changed").length;
    const pending = patients.filter(p=>p.status==="pending").length;
    const escalated = patients.filter(p=>p.actionTaken?.type==="escalated"||p.actionTaken?.type==="reviewed").length;
    return { actionRequired, cleared, pending, escalated };
  },[patients]);

  const filteredPatients = useMemo(()=>{
    if(filterStatus==="all") return patients;
    if(filterStatus==="action") return patients.filter(p=>(p.status==="discrepancy"||p.status==="escalate")&&!p.actionTaken);
    if(filterStatus==="cleared") return patients.filter(p=>p.status==="cleared"||p.actionTaken?.type==="changed");
    if(filterStatus==="pending") return patients.filter(p=>p.status==="pending");
    return patients;
  },[patients, filterStatus]);

  const filterPills = [
    { id:"all", label:"All" },
    { id:"action", label:`Action (${stats.actionRequired})` },
    { id:"cleared", label:`Cleared (${stats.cleared})` },
    { id:"pending", label:`Pending (${stats.pending})` },
  ];

  return <div className="h-screen flex flex-col bg-gray-100 overflow-hidden">
    {/* Header */}
    <header className="bg-blue-900 text-white px-4 py-3 shadow-lg flex-shrink-0">
      <div className="flex items-center justify-between gap-4">
        <div className="flex items-center gap-3">
          <div className="text-2xl">⚕</div>
          <div>
            <div className="font-bold text-lg leading-tight">UCx AI Agent</div>
            <div className="text-blue-300 text-xs">RN Culture Review Workflow</div>
          </div>
        </div>

        {/* Stats */}
        <div className="hidden md:flex items-center gap-4 text-sm">
          <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-red-400 inline-block"></span><span className="text-blue-200">{stats.actionRequired} Action Required</span></div>
          <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-green-400 inline-block"></span><span className="text-blue-200">{stats.cleared} Cleared</span></div>
          <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-gray-400 inline-block"></span><span className="text-blue-200">{stats.pending} Pending</span></div>
        </div>

        {/* Institution Toggle */}
        <div className="flex items-center gap-2">
          <span className="text-xs text-blue-300 hidden lg:inline">Antibiogram:</span>
          <div className="flex rounded-lg overflow-hidden border border-blue-700 text-xs">
            {[{id:"stanford",label:"Stanford 2025"},{id:"mgh",label:"MGH 2018"}].map(opt=>(
              <button key={opt.id} onClick={()=>{setInstitution(opt.id);setCustomAntibiogram(null);}}
                className={`px-3 py-1.5 font-medium transition-colors ${(customAntibiogram?false:institution===opt.id)?"bg-blue-400 text-white":"bg-blue-900 text-blue-300 hover:bg-blue-800"}`}>
                {opt.label}
              </button>
            ))}
            <label className={`px-3 py-1.5 font-medium cursor-pointer transition-colors ${customAntibiogram?"bg-blue-400 text-white":"bg-blue-900 text-blue-300 hover:bg-blue-800"}`}>
              + Upload
              <input ref={fileRef} type="file" accept=".json,.csv" className="hidden" onChange={e=>{
                const file=e.target.files?.[0]; if(!file)return;
                const reader=new FileReader();
                reader.onload=ev=>{ try{ setCustomAntibiogram(JSON.parse(ev.target.result)); }catch{ alert("Invalid JSON"); } };
                reader.readAsText(file);
              }}/>
            </label>
          </div>
          {customAntibiogram && <span className="text-xs bg-blue-600 px-2 py-1 rounded">Custom</span>}
        </div>
      </div>
    </header>

    {/* Load More Banner */}
    {showLoadMore && (
      <div className="bg-blue-50 border-b border-blue-200 px-4 py-2.5 flex items-center justify-between flex-shrink-0">
        <span className="text-sm text-blue-800 font-medium">✓ All active cases resolved — {ALL_PATIENTS.length - batchIndex*BATCH_SIZE} more patients in queue</span>
        <button onClick={loadNextBatch} className="text-sm px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium">
          Load Next {Math.min(BATCH_SIZE, ALL_PATIENTS.length-batchIndex*BATCH_SIZE)} Patients
        </button>
      </div>
    )}

    {/* Main Layout */}
    <div className="flex flex-1 overflow-hidden">
      {/* Patient Queue */}
      <div className="w-80 flex-shrink-0 bg-gray-50 border-r border-gray-200 flex flex-col">
        <div className="px-2 py-2 border-b border-gray-200 flex-shrink-0">
          <div className="flex gap-1 flex-wrap">
            {filterPills.map(f=>(
              <button key={f.id} onClick={()=>setFilterStatus(f.id)}
                className={`text-xs px-2.5 py-1 rounded-full font-medium transition-colors ${filterStatus===f.id?"bg-blue-600 text-white":"bg-white text-gray-600 border border-gray-300 hover:border-gray-400"}`}>
                {f.label}
              </button>
            ))}
          </div>
        </div>
        <div className="flex-1 overflow-y-auto scrollbar-thin py-2">
          {filteredPatients.length===0 && (
            <div className="text-center text-sm text-gray-400 mt-8 px-4">No patients in this category</div>
          )}
          {filteredPatients.map(p=>(
            <PatientCard key={p.id} patient={p} isSelected={p.id===selectedId} onClick={()=>setSelectedId(p.id)} />
          ))}
        </div>
        <div className="p-2 border-t border-gray-200 text-center text-xs text-gray-400">
          {patients.length} patients loaded · Batch {batchIndex}/{Math.ceil(ALL_PATIENTS.length/BATCH_SIZE)}
        </div>
      </div>

      {/* Workspace */}
      <div className="flex-1 overflow-hidden">
        {selectedPatient ? (
          <PatientWorkspace key={selectedPatient.id} patient={selectedPatient} institution={institution} onAction={handleAction} />
        ) : (
          <div className="flex items-center justify-center h-full text-gray-400">
            <div className="text-center">
              <div className="text-5xl mb-3">⚕</div>
              <div className="text-lg font-medium">Select a patient to begin review</div>
              <div className="text-sm mt-1">Use the queue on the left to navigate patients</div>
            </div>
          </div>
        )}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
