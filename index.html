function rndInt(lo,hi){ return Math.floor(Math.random()*(hi-lo+1))+lo; }

function buildSusceptibilities(organism) {
  const abx = ANTIBIOGRAMS.stanford.organisms[organism] || {};
  return Object.keys(abx).map(drug => {
    const pct = abx[drug];
    let interp = pct>=80?"S":pct>=50?(Math.random()>.4?"S":"I"):pct>=20?(Math.random()>.5?"I":"R"):"R";
    const micVals = { S:["≤0.25","≤0.5","≤1","≤2"], I:["4","8","16"], R:["≥32","≥64","≥128"] };
    return { drug, mic:rnd(micVals[interp]), interpretation:interp };
  });
}

function generatePatients(count) {

  const typeMap = Array.from({length:count},()=>{
    const r=Math.random();
    return r<.50?"cleared":r<.80?"discrepancy":r<.92?"pyelo":"mdro";
  });

  const usedNames = new Set();

    let organism;
    if(caseType==="mdro")       organism=rnd(["MRSA","VRE (E. faecium)","ESBL E. coli","ESBL Klebsiella","CRE Klebsiella","MDR Pseudomonas"]);
    else if(caseType==="pyelo") organism=rnd(["E. coli","Klebsiella pneumoniae","Proteus mirabilis","ESBL E. coli","Pseudomonas aeruginosa"]);
    else if(caseType==="discrepancy") organism=rnd(NON_MDRO_ORGS); // ← guaranteed non-MDRO
    else                        organism=rnd(GENERAL_POOL);

    const oMeta = ORGANISM_META[organism]||{gram:"Unknown",isMDRO:false};
    const susceptibilities = buildSusceptibilities(organism);
    const abxData = ANTIBIOGRAMS.stanford.organisms[organism]||{};
    const isMDRO = caseType==="mdro"||oMeta.isMDRO;
    const isDiscrepancy = caseType==="discrepancy";
    const isPyelo = caseType==="pyelo";

    const activeDrug = (() => {
      const cands = EMPIRIC_FOR[organism]||["TMP-SMX","Ciprofloxacin"];
      if(!isDiscrepancy&&!isPyelo&&!isMDRO){
        const g=cands.filter(d=>(abxData[d]||0)>=70); return g[0]||cands[0];
      }
      const b=cands.filter(d=>(abxData[d]||0)<50); return b[0]||cands[cands.length-1];
    })();

    const age=rndInt(18,92), sex=Math.random()>.35?"F":"M";
    let fname,lname,key;
    do{ fname=rnd(FIRST_NAMES);lname=rnd(LAST_NAMES);key=fname+lname; }while(usedNames.has(key));
    usedNames.add(key);

    const numAllergies=Math.random()<.5?0:Math.random()<.6?1:2;
    const allergies=[]; const aPool=[...ALLERGIES_POOL];
    for(let j=0;j<numAllergies;j++){ const idx=rndInt(0,aPool.length-1); allergies.push(aPool.splice(idx,1)[0]); }

    const dob = new Date(2026-age,rndInt(0,11),rndInt(1,28));
    const colDaysAgo = rndInt(1,5);
    const collectedAt = new Date(Date.now()-colDaysAgo*86400000-rndInt(2,8)*3600000);
    const finalizedAt = new Date(collectedAt.getTime()+rndInt(24,48)*3600000);
    const encounterDate = new Date(collectedAt.getTime()-rndInt(0,12)*3600000).toISOString().slice(0,10);
    const isDischarge = Math.random()<.72;
    const phone=`(${rndInt(415,916)}) ${rndInt(200,999)}-${String(rndInt(1000,9999))}`;

    let status="cleared", escalateReasons=[];
    const activePct = abxData[activeDrug]||0;

    if(caseType==="cleared"&&!isMDRO) status="cleared";
    else if(isPyelo){ status="escalate"; escalateReasons.push("Pyelonephritis / upper tract involvement"); if(isMDRO) escalateReasons.push("MDRO organism"); }
    else if(isMDRO){ status="escalate"; escalateReasons.push("MDRO organism — "+organism); const sDrugs=Object.entries(abxData).filter(([,p])=>p>=70).map(([d])=>d); if(sDrugs.length===0||sDrugs.every(d=>(DRUG_META[d]||{}).route==="IV")) escalateReasons.push("No oral antibiotic options — IV therapy required"); }
    else if(isDiscrepancy&&activePct<50) status="discrepancy";
    else status="cleared";

    allergies.forEach(al=>{
      const drugClass=(DRUG_META[activeDrug]||{}).class||"";
      const cross=ALLERGY_CROSS[al.substance.toLowerCase()]||[];
      if(cross.includes(drugClass)&&al.severity==="severe/anaphylaxis"){
        if(status!=="escalate"){status="escalate";escalateReasons.push(`Allergy conflict: ${al.substance} (anaphylaxis) vs ${activeDrug}`);}
        else escalateReasons.push(`Allergy conflict: ${al.substance} (anaphylaxis)`);
      }
    });

    const ua={
      color:rnd(["Yellow","Dark yellow","Amber","Cloudy yellow"]),
      clarity:rnd(["Cloudy","Turbid","Hazy"]),
      wbc:(isPyelo||isMDRO||isDiscrepancy)?rnd([">100","50-100","25-50"])+" cells/hpf":rnd(["10-25","5-10",">100"])+" cells/hpf",
      rbc:rnd(["0-2","2-5","5-10"])+" cells/hpf",
      bacteria:(isPyelo||isMDRO||isDiscrepancy)?rnd(["Many","Moderate"]):rnd(["Many","Moderate","Few"]),
      nitrite:(organism.includes("Enterococcus")||organism.includes("MRSA")||organism.includes("VRE"))?"-":rnd(["+","+","+"," -"]),
      leukocyteEsterase:(isPyelo||isMDRO)?rnd(["3+","3+","2+"]):rnd(["2+","3+","1+"]),
      squamousEpithelialCells:rnd(["<2/hpf","None","<5/hpf"]),
      pH:rnd(["5.5","6.0","6.5","7.0"]),
      specificGravity:`1.0${rndInt(10,30)}`,
      glucose:"Negative", protein:rnd(["Negative","Trace"]),
    };

    return {
      id:seededId(i), mrn:`MRN${String(2000000+i*37+13).slice(0,7)}`,
      name:{first:fname,last:lname}, dob:dob.toISOString().slice(0,10), age, sex,
      encounterDate, encounterMD:rnd(PROVIDERS), isDischarge, unit:isDischarge?null:rnd(UNITS), phone,
      allergies,
      activeMedication:{ drug:activeDrug, dose:(DRUG_META[activeDrug]||{}).doseStd||"500mg BID", route:(DRUG_META[activeDrug]||{}).route||"PO", prescribedAt:new Date(collectedAt.getTime()-rndInt(6,24)*3600000).toISOString(), indication:"Empiric UTI" },
      urinalysis:ua,
      culture:{ specimenType:rnd(["Clean catch midstream","Clean catch midstream","Catheter"]), collectedAt:collectedAt.toISOString(), finalizedAt:finalizedAt.toISOString(), colonyCount:rnd([">100,000 CFU/mL",">100,000 CFU/mL","50,000–100,000 CFU/mL"]), organism, gramStain:oMeta.gram, susceptibilities, isMDRO },
      clinicalContext:buildContext(organism,caseType,age,sex),
      status, escalateReasons,
      requiresAdmission:escalateReasons.some(r=>r.includes("IV therapy")||r.includes("No oral")),
      actionTaken:null,
    };
  });
}

/* ═══════════════════════════════════════════════════════
   DECISION ENGINE
══════════════════════════════════════════════════════════ */
function getAllergyClasses(allergies) {
  const cls = new Set();
  allergies.forEach(al => {
    if(al.severity==="severe/anaphylaxis"||al.severity==="moderate"){
      const sub=al.substance.toLowerCase();
      if(sub.includes("penicillin")||sub.includes("amoxicillin")||sub.includes("ampicillin")){ cls.add("penicillin"); if(al.severity==="severe/anaphylaxis") cls.add("cephalosporin"); }
      if(sub.includes("sulfa")||sub.includes("tmp")) cls.add("sulfa");
      if(sub.includes("cipro")||sub.includes("fluoroquinolone")||sub.includes("levo")) cls.add("fluoroquinolone");
      if(sub.includes("cephalexin")||sub.includes("ceph")) cls.add("cephalosporin");
      if(sub.includes("nitrofurantoin")) cls.add("nitrofuran");
      if(sub.includes("doxycycline")||sub.includes("tetracycline")) cls.add("tetracycline");
      if(sub.includes("vancomycin")) cls.add("glycopeptide");
    }
  });
  return cls;
}

function analyzePatient(patient, institution) {
  const orgGram = (ANTIBIOGRAMS[institution]||ANTIBIOGRAMS.stanford).organisms[patient.culture.organism]||{};
  const allergyClasses = getAllergyClasses(patient.allergies);
  const activeDrug = patient.activeMedication.drug;
  const cultureResult = patient.culture.susceptibilities.find(s=>s.drug===activeDrug);
  const cultureInterp = cultureResult?.interpretation||"?";
  const isResistant = cultureInterp==="R"||cultureInterp==="I";

  const recs = Object.entries(orgGram)
    .filter(([d])=>d!==activeDrug)
    .map(([drug,pct])=>{ const m=DRUG_META[drug]||{}; return { drug,susceptPct:pct,route:m.route||"PO",class:m.class,narrow:m.narrow||5,dose:m.doseStd||"",indication:m.indication||"",isAllergyConflict:allergyClasses.has(m.class) }; })
    .filter(r=>r.susceptPct>=60&&!r.isAllergyConflict)
    .sort((a,b)=>a.narrow-b.narrow||b.susceptPct-a.susceptPct);

  const allSusc=Object.entries(orgGram).filter(([,p])=>p>=60).map(([d])=>d);
  const oralOpts=allSusc.filter(d=>(DRUG_META[d]||{}).route==="PO");
  const requiresAdmission=oralOpts.length===0&&allSusc.length>0;

  return {
    cultureInterp, isResistant,
    isPyelo:hasPyelo(patient.clinicalContext),
    isMDRO:patient.culture.isMDRO,
    requiresAdmission,
    recommendations:recs.slice(0,5),
    escalateReasons:[...patient.escalateReasons,...(requiresAdmission&&!patient.escalateReasons.some(r=>r.includes("oral"))?["No oral antibiotic options — IV therapy required"]:[])],
    allergyClasses:Array.from(allergyClasses),
  };
}

    background:`Empiric ${patient.activeMedication.drug} for UTI. Culture: ${patient.culture.organism} (${patient.culture.colonyCount}), Gram stain: ${patient.culture.gramStain}. Allergies: ${patient.allergies.length?patient.allergies.map(a=>`${a.substance} [${a.severity}]`).join(", "):"NKDA"}.`,
    assessment:`Escalation required: ${analysis.escalateReasons.join("; ")}. ${analysis.requiresAdmission?"No susceptible oral antibiotics — IV therapy required.":""} ${analysis.isPyelo?"Clinical context consistent with pyelonephritis.":""}`,
    recommendation:`${isPyeloOrAdmit?"Patient callback recommended — likely requires hospital admission for IV antibiotic therapy. ":""}Options per antibiogram: ${recNames}. ${analysis.isMDRO?"ID consult strongly recommended.":""}`,
  });
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-3">
      <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[92vh] flex flex-col">
        <div className={`flex items-center justify-between px-5 py-4 border-b flex-shrink-0 ${isPyeloOrAdmit?"bg-amber-50":""}`}>
          <div>
            <h2 className="text-base font-bold text-gray-900">Escalate to MD</h2>
            {isPyeloOrAdmit&&<p className="text-xs text-amber-700 font-medium mt-0.5">⚠ Patient callback likely required — admission recommended</p>}
          </div>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl p-1">&times;</button>
        </div>
        <div className="overflow-y-auto flex-1 p-5 space-y-3">
          {analysis.escalateReasons.length>0&&(
            <div className="p-3 bg-orange-50 border border-orange-200 rounded-lg">
              <div className="text-xs font-semibold text-orange-800 mb-1">Escalation Triggers:</div>
              <ul className="text-xs text-orange-700 space-y-0.5">{analysis.escalateReasons.map((r,i)=><li key={i} className="flex gap-2"><span>•</span>{r}</li>)}</ul>
            </div>
          )}
          {patient.isDischarge&&(
            <div className="p-3 bg-blue-50 border border-blue-200 rounded-lg flex items-center justify-between gap-2">
              <div className="text-sm text-blue-800"><span className="font-semibold">📞 Patient callback:</span> {patient.phone}</div>
              <button onClick={()=>navigator.clipboard?.writeText(patient.phone)} className="text-xs px-2 py-1 border border-blue-300 rounded text-blue-700 hover:bg-blue-100 flex-shrink-0">Copy</button>
            </div>
          )}
          {[{k:"situation",l:"SITUATION"},{k:"background",l:"BACKGROUND"},{k:"assessment",l:"ASSESSMENT"},{k:"recommendation",l:"RECOMMENDATION"}].map(({k,l})=>(
            <div key={k}>
              <div className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">{l}</div>
              <textarea className="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#1976D2] resize-none" rows={3} value={sbar[k]} onChange={e=>setSbar(p=>({...p,[k]:e.target.value}))}/>
            </div>
          ))}
        </div>
        <div className="px-5 py-3 border-t flex-shrink-0 flex flex-col sm:flex-row justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 text-sm text-gray-600 border border-gray-300 rounded-lg">Cancel</button>
          <button onClick={()=>onConfirm(Object.values(sbar).join("\n\n"))} className={`px-5 py-2 text-sm font-semibold text-white rounded-lg ${isPyeloOrAdmit?"bg-amber-600 hover:bg-amber-700":"bg-orange-600 hover:bg-orange-700"}`}>
            📞 Send Escalation to MD
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════

function PatientWorkspace({ patient, institution, onAction }) {
  const analysis = useMemo(()=>analyzePatient(patient,institution),[patient,institution]);
  const canChangeRx = patient.status==="discrepancy"
    && !patient.escalateReasons.some(r=>r.includes("MDRO")||r.includes("IV therapy")||r.includes("Allergy conflict")||r.includes("Pyelonephritis"))
    && !patient.actionTaken;
  const mustEscalate = patient.status==="escalate"||analysis.requiresAdmission||analysis.isPyelo||analysis.isMDRO;
  const effStatus = patient.actionTaken
    ? (patient.actionTaken.type==="changed"?"cleared":patient.actionTaken.type==="pharmacy"?"pharmacy":"escalate")
    : patient.status;
  const [expanded,setExpanded]=useState({ meds:true, ua:patient.status!=="cleared", culture:true });
  const [showChangeRx,setShowChangeRx]=useState(false);
  const [showEscalate,setShowEscalate]=useState(false);
  const [showPharmacy,setShowPharmacy]=useState(false);
  const toggle=k=>setExpanded(p=>({...p,[k]:!p[k]}));

  return (
    <div className="h-full flex flex-col bg-white">

      <div className="px-4 sm:px-5 py-3 border-b flex-shrink-0" style={{background:"#1976D2"}}>
        <div className="flex items-start justify-between gap-3">

            <h2 className="text-base sm:text-lg font-bold text-white leading-tight truncate">{patient.name.last}, {patient.name.first}</h2>
            <div className="text-blue-100 text-xs mt-0.5">{patient.age}yo {patient.sex==="F"?"Female":"Male"} · DOB {fmtDate(patient.dob)} · {patient.mrn}</div>
            <div className="text-blue-200 text-xs mt-0.5 flex flex-wrap items-center gap-1">
              <span className="truncate">Enc: {fmtDate(patient.encounterDate)} · {patient.encounterMD.replace("Dr. ","Dr. ")}</span>
              {patient.isDischarge
                ? <span className="bg-blue-800/60 text-blue-100 px-1.5 py-0.5 rounded text-xs flex-shrink-0">📤 DC'd</span>
                : <span className="bg-blue-800/60 text-blue-100 px-1.5 py-0.5 rounded text-xs flex-shrink-0">🏥 {patient.unit}</span>}
            </div>
          </div>
          <div className="flex flex-col items-end gap-1.5 flex-shrink-0">
            <StatusBadge status={effStatus}/>
            {patient.allergies.length>0
              ? <div className="flex flex-wrap gap-1 justify-end">{patient.allergies.map((a,i)=><AllergyChip key={i} al={a}/>)}</div>

        </div>
      </div>

      {/* Scrollable accordion content */}
      <div className="flex-1 overflow-y-auto scrollbar-thin p-3 sm:p-4 pb-2">

        {/* Meds */}
        <AccordionSection title="Epic Meds & Clinical Context" expanded={expanded.meds} onToggle={()=>toggle("meds")}>
          <div className="rounded-lg border border-gray-200 overflow-hidden mb-3">
            <div className="bg-epic-sectionBg px-3 py-2 border-b flex items-center gap-2">
              <span className="text-xs font-semibold text-epic-dark">Active Medications</span>
              <span className="text-xs bg-[#BBDEFB] text-epic-dark px-1.5 py-0.5 rounded">EPIC Live</span>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm min-w-[320px]">
                <thead className="text-xs text-gray-500 uppercase bg-gray-50 border-b">
                  <tr><th className="px-3 py-2 text-left">Medication</th><th className="px-3 py-2 text-left">Dose/Route</th><th className="px-3 py-2 text-left hidden sm:table-cell">Ordered</th></tr>
                </thead>
                <tbody>
                  <tr className={`border-t ${effStatus==="discrepancy"||effStatus==="escalate"?"bg-red-50":effStatus==="cleared"?"bg-green-50":""}`}>
                    <td className="px-3 py-2.5 font-semibold text-sm">{patient.activeMedication.drug}</td>
                    <td className="px-3 py-2.5 text-gray-600 text-xs">{patient.activeMedication.dose} {patient.activeMedication.route}</td>
                    <td className="px-3 py-2.5 text-gray-400 text-xs hidden sm:table-cell">{fmtDateTime(patient.activeMedication.prescribedAt)}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div className="p-3 bg-blue-50 border border-[#BBDEFB] rounded-lg text-sm text-blue-900 leading-relaxed">
            <div className="text-xs font-semibold text-epic-dark mb-1 uppercase tracking-wide">Workup Summary</div>
            <p className="text-xs sm:text-sm">{patient.clinicalContext}</p>
          </div>
        </AccordionSection>

        {/* UA */}
        <AccordionSection title="Urinalysis" badge={patient.urinalysis.leukocyteEsterase+" LE"} expanded={expanded.ua} onToggle={()=>toggle("ua")}>
          <div className="grid grid-cols-2 gap-px bg-gray-100 border border-gray-200 rounded-lg overflow-hidden">
            {[["Color",patient.urinalysis.color],["Clarity",patient.urinalysis.clarity],["pH",patient.urinalysis.pH],["Specific Gravity",patient.urinalysis.specificGravity],["WBC",patient.urinalysis.wbc],["RBC",patient.urinalysis.rbc],["Bacteria",patient.urinalysis.bacteria],["Nitrite",patient.urinalysis.nitrite],["Leukocyte Esterase",patient.urinalysis.leukocyteEsterase],["Squamous Cells",patient.urinalysis.squamousEpithelialCells],["Glucose",patient.urinalysis.glucose],["Protein",patient.urinalysis.protein]].map(([label,val])=>(
              <div key={label} className="bg-white px-3 py-2 flex justify-between items-center gap-2">
                <span className="text-xs text-gray-500 flex-shrink-0">{label}</span>
                <span className={`text-xs font-semibold text-right ${(val==="Many"||val==="3+"||val==="+"||val?.includes(">100"))?"text-red-700":""}`}>{val}</span>
              </div>
            ))}
          </div>
          {analysis.isPyelo&&<div className="mt-3 p-2.5 bg-red-50 border border-red-200 rounded-lg text-xs text-red-800"><strong>⚠ Pyelonephritis flags:</strong> Systemic symptoms detected (fever, flank pain, CVA tenderness). Upper tract involvement likely.</div>}
        </AccordionSection>

        {/* Culture */}
        <AccordionSection title="Culture Results" badge={patient.culture.organism} expanded={expanded.culture} onToggle={()=>toggle("culture")}>
          <div className="grid grid-cols-2 gap-2 mb-3">
            {[["Organism",patient.culture.organism],["Gram Stain",patient.culture.gramStain],["Colony Count",patient.culture.colonyCount],["Specimen",patient.culture.specimenType],["Collected",fmtDateTime(patient.culture.collectedAt)],["Finalized",fmtDateTime(patient.culture.finalizedAt)]].map(([k,v])=>(
              <div key={k} className="bg-epic-sectionBg rounded-lg p-2 border border-[#BBDEFB]">
                <div className="text-xs text-gray-400 uppercase tracking-wide">{k}</div>
                <div className={`text-xs font-semibold mt-0.5 ${k==="Organism"?"italic":""}`}>{v}</div>
              </div>
            ))}
          </div>
          <div className="rounded-lg border border-gray-200 overflow-hidden">
            <div className="bg-epic-sectionBg px-3 py-2 border-b text-xs font-semibold text-epic-dark uppercase tracking-wide">Susceptibility Panel — MIC</div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm min-w-[280px]">
                <thead className="text-xs text-gray-500 uppercase bg-gray-50 border-b">
                  <tr><th className="px-3 py-1.5 text-left">Antibiotic</th><th className="px-3 py-1.5 text-center">MIC</th><th className="px-3 py-1.5 text-center">Result</th><th className="px-3 py-1.5 text-center hidden sm:table-cell">Route</th></tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {patient.culture.susceptibilities.map((s,i)=>{
                    const isActive=s.drug===patient.activeMedication.drug;
                    const rowBg=isActive?(s.interpretation==="R"?"bg-red-50":s.interpretation==="I"?"bg-yellow-50":"bg-green-50"):"";
                    const lBorder=isActive?("border-l-4 "+(s.interpretation==="R"?"border-l-red-500":s.interpretation==="I"?"border-l-yellow-500":"border-l-green-500")):"";
                    return <tr key={i} className={`${rowBg} ${lBorder} ${isActive?"font-semibold":""}`}>
                      <td className="px-3 py-2 text-xs">
                        {s.drug}
                        {isActive&&<span className="ml-1 text-xs bg-[#BBDEFB] text-epic-dark px-1 py-0.5 rounded">Active</span>}
                      </td>
                      <td className="px-3 py-2 text-center font-mono text-gray-600 text-xs">{s.mic}</td>
                      <td className="px-3 py-2 text-center">
                        <span className={`px-1.5 py-0.5 rounded text-xs font-bold ${s.interpretation==="S"?"bg-green-100 text-green-800":s.interpretation==="I"?"bg-yellow-100 text-yellow-800":"bg-red-100 text-red-800"}`}>
                          {s.interpretation==="S"?"Susceptible":s.interpretation==="I"?"Intermediate":"Resistant"}
                        </span>
                      </td>
                      <td className="px-3 py-2 text-center text-xs text-gray-500 hidden sm:table-cell">{(DRUG_META[s.drug]||{}).route||"PO"}</td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </AccordionSection>
      </div>

      {/* ── AI Decision Panel (sticky bottom) ── */}
      <div className={`border-t flex-shrink-0 ${analysis.requiresAdmission?"bg-amber-50 border-amber-200":effStatus==="discrepancy"||effStatus==="escalate"?"bg-red-50 border-red-200":effStatus==="cleared"?"bg-green-50 border-green-200":effStatus==="pharmacy"?"bg-teal-50 border-teal-200":"bg-epic-sectionBg border-[#BBDEFB]"} p-3 sm:p-4`}>

        {/* Banner */}
        {patient.actionTaken ? (
          <div className={`mb-3 p-2.5 rounded-lg border flex items-center justify-between gap-2 ${patient.actionTaken.type==="changed"?"bg-green-100 border-green-300 text-green-800":patient.actionTaken.type==="pharmacy"?"bg-teal-100 border-teal-300 text-teal-800":"bg-orange-100 border-orange-300 text-orange-800"}`}>
            <span className="text-xs sm:text-sm font-semibold">
              ✓ {patient.actionTaken.type==="changed"?`Rx → ${patient.actionTaken.drug}`:patient.actionTaken.type==="pharmacy"?"Pharmacy consulted":"Escalated to MD"} — {fmtDateTime(patient.actionTaken.timestamp)}
            </span>
            <button onClick={()=>{ if(patient.actionTaken.type==="changed")setShowChangeRx(true); else if(patient.actionTaken.type==="pharmacy")setShowPharmacy(true); else setShowEscalate(true); }} className="text-xs px-2 py-1 border rounded hover:bg-white/60 flex-shrink-0">Revise</button>
          </div>
        ) : (effStatus==="discrepancy"||effStatus==="escalate")&&(
          <div className={`mb-3 p-2.5 rounded-lg border ${analysis.requiresAdmission?"bg-amber-100 border-amber-300":"bg-red-100 border-red-300"}`}>
            <div className={`text-sm font-bold ${analysis.requiresAdmission?"text-amber-900":"text-red-900"}`}>
              {analysis.requiresAdmission?"⚠ Likely Admission — No Oral Options":analysis.isPyelo?"⚠ Pyelonephritis / Upper Tract":analysis.isMDRO?"⚠ MDRO — Escalation Required":"⚠ Culture Resistance Discrepancy"}
            </div>
            <div className={`text-xs mt-0.5 ${analysis.requiresAdmission?"text-amber-800":"text-red-800"}`}>
              {analysis.requiresAdmission?`No oral antibiotics for ${patient.culture.organism}. IV therapy required.${patient.isDischarge?" Discharged — callback for admission coordination.":""}`:analysis.isPyelo?"Upper tract infection. IV antibiotics + MD review indicated.":analysis.isMDRO?`${patient.culture.organism} is MDRO. Standard protocol unavailable.`:`${patient.activeMedication.drug} RESISTANT. Culture-guided change recommended.`}
            </div>
          </div>
        )}

        {/* Recommendations */}
        {!patient.actionTaken && analysis.recommendations.length>0 && (
          <div className="mb-3">
            <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">AI Recommendations — {ANTIBIOGRAMS[institution]?.name||"Stanford"}</div>
            <div className="flex flex-col sm:flex-row gap-2">
              {analysis.recommendations.slice(0,3).map((rec,i)=>(
                <div key={rec.drug} className="bg-white rounded-lg border border-[#BBDEFB] p-2.5 flex-1 shadow-sm">
                  <div className="flex items-center gap-1 mb-1">
                    <span className="text-xs text-gray-400 font-bold">#{i+1}</span>
                    <span className="text-sm font-bold text-gray-900 truncate">{rec.drug}</span>
                    <span className={`ml-auto text-xs px-1.5 py-0.5 rounded font-bold flex-shrink-0 ${rec.susceptPct>=90?"bg-green-100 text-green-800":rec.susceptPct>=75?"bg-blue-100 text-blue-800":"bg-yellow-100 text-yellow-800"}`}>{rec.susceptPct}%S</span>
                  </div>
                  <div className="text-xs text-gray-400">{rec.dose}</div>
                  <div className="flex items-center gap-1 mt-1 flex-wrap">
                    <span className={`text-xs px-1.5 py-0.5 rounded ${rec.route==="IV"?"bg-purple-100 text-purple-700":"bg-gray-100 text-gray-600"}`}>{rec.route}</span>
                    {rec.indication&&<span className="text-xs text-amber-700">⚠ {rec.indication}</span>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Action buttons — mobile stacks vertically */}
        {!patient.actionTaken && (
          <div className="flex flex-col sm:flex-row gap-2">
            <div className="flex gap-2 flex-1">
              <button onClick={()=>setShowChangeRx(true)} disabled={!canChangeRx}
                title={!canChangeRx?"Requires MD review":"Change antibiotic per protocol"}
                className={`flex-1 py-2.5 px-3 rounded-lg text-sm font-semibold transition-all ${canChangeRx?"bg-[#1976D2] hover:bg-[#1565C0] text-white shadow":"bg-gray-100 text-gray-400 cursor-not-allowed"}`}>
                💊 Change Rx
              </button>
              <button onClick={()=>setShowPharmacy(true)} className="px-3 py-2.5 rounded-lg text-sm font-semibold border border-teal-400 text-teal-700 hover:bg-teal-50 flex-shrink-0">
                🔬 Pharmacy
              </button>
            </div>
            <button onClick={()=>setShowEscalate(true)}
              className={`w-full sm:flex-1 py-2.5 px-3 rounded-lg text-sm font-semibold text-white shadow transition-all ${analysis.requiresAdmission||analysis.isPyelo?"bg-amber-600 hover:bg-amber-700 pulse-amber":"bg-orange-600 hover:bg-orange-700"} ${mustEscalate?"ring-2 ring-offset-1 ring-orange-400":""}`}>
              📞 Escalate to MD
            </button>
          </div>
        )}
        {effStatus==="cleared"&&!patient.actionTaken&&(
          <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
            <div className="flex-1 p-2 bg-green-100 border border-green-300 rounded-lg text-sm text-green-800 font-medium text-center">✓ Empiric therapy confirmed susceptible</div>
            <button onClick={()=>onAction(patient.id,"reviewed",null,null)} className="px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-semibold rounded-lg">Mark Reviewed</button>
          </div>
        )}
      </div>

      {showChangeRx&&<ChangeRxModal patient={patient} analysis={analysis} onConfirm={(drug,note)=>{ onAction(patient.id,"changed",drug,note); setShowChangeRx(false); }} onClose={()=>setShowChangeRx(false)}/>}
      {showPharmacy&&<PharmacyModal patient={patient} analysis={analysis} onConfirm={(note)=>{ onAction(patient.id,"pharmacy",null,note); setShowPharmacy(false); }} onClose={()=>setShowPharmacy(false)}/>}
      {showEscalate&&<EscalateModal patient={patient} analysis={analysis} onConfirm={(note)=>{ onAction(patient.id,"escalated",null,note); setShowEscalate(false); }} onClose={()=>setShowEscalate(false)}/>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════

const ALL_PATIENTS = generatePatients(120);
const BATCH_SIZE   = 15;

function App() {
  const [institution,setInstitution] = useState("stanford");
  const [patients,setPatients]       = useState(ALL_PATIENTS.slice(0,BATCH_SIZE));
  const [batchIdx,setBatchIdx]       = useState(1);
  const [selectedId,setSelectedId]   = useState(ALL_PATIENTS[0].id);
  const [filterStatus,setFilter]     = useState("all");
  const [showLoadMore,setLoadMore]   = useState(false);
  const [customABG,setCustomABG]     = useState(null);
  const [mobilePane,setMobilePane]   = useState("queue"); // "queue" | "workspace"
  const fileRef = useRef();

  const selectedPatient = patients.find(p=>p.id===selectedId);

  // Select patient + auto-navigate to workspace on mobile
  const selectPatient = useCallback((id)=>{
    setSelectedId(id);
    setMobilePane("workspace");
  },[]);

  const handleAction = useCallback((id,type,drug,note)=>{
    setPatients(prev=>prev.map(p=>p.id===id?{...p,actionTaken:{type,drug,note,timestamp:new Date().toISOString()}}:p));
  },[]);

  useEffect(()=>{
    const active=patients.filter(p=>(p.status==="discrepancy"||p.status==="escalate")&&!p.actionTaken);
    setLoadMore(active.length===0&&batchIdx*BATCH_SIZE<ALL_PATIENTS.length);
  },[patients,batchIdx]);

  function loadNextBatch(){
    const next=ALL_PATIENTS.slice(batchIdx*BATCH_SIZE,(batchIdx+1)*BATCH_SIZE);
    setPatients(prev=>[...prev,...next]); setBatchIdx(b=>b+1); setLoadMore(false);
    if(next.length>0){ setSelectedId(next[0].id); setMobilePane("workspace"); }
  }

  const stats = useMemo(()=>({
    actionRequired: patients.filter(p=>(p.status==="discrepancy"||p.status==="escalate")&&!p.actionTaken).length,
    cleared:        patients.filter(p=>p.status==="cleared"||p.actionTaken?.type==="changed").length,
    pending:        patients.filter(p=>p.status==="pending").length,
  }),[patients]);

  const filtered = useMemo(()=>{
    if(filterStatus==="all")     return patients;
    if(filterStatus==="action")  return patients.filter(p=>(p.status==="discrepancy"||p.status==="escalate")&&!p.actionTaken);
    if(filterStatus==="cleared") return patients.filter(p=>p.status==="cleared"||p.actionTaken?.type==="changed");
    if(filterStatus==="pending") return patients.filter(p=>p.status==="pending");
    return patients;
  },[patients,filterStatus]);

  return (
    <div className="h-screen flex flex-col bg-epic-bg overflow-hidden">

      {/* ── Header ── */}
      <header style={{background:"#1976D2"}} className="text-white px-4 py-2.5 shadow-md flex-shrink-0">
        <div className="flex items-center justify-between gap-3">
          {/* Logo */}
          <div className="flex items-center gap-2 flex-shrink-0">
            <span className="text-lg">⚕</span>
            <div>
              <div className="font-bold text-sm sm:text-base leading-tight">UCx AI Agent</div>
              <div className="text-blue-200 text-xs hidden sm:block">RN Culture Review Workflow</div>
            </div>
          </div>

          {/* Desktop stats */}
          <div className="hidden md:flex items-center gap-4">
            <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-red-300 inline-block"></span><span className="text-blue-100 text-xs">{stats.actionRequired} Action Required</span></div>
            <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-green-300 inline-block"></span><span className="text-blue-100 text-xs">{stats.cleared} Cleared</span></div>
            <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-gray-300 inline-block"></span><span className="text-blue-100 text-xs">{stats.pending} Pending</span></div>
          </div>

          {/* Institution toggle */}
          <div className="flex items-center gap-2 flex-shrink-0">
            <span className="text-xs text-blue-200 hidden lg:inline">Antibiogram:</span>
            {/* Mobile: compact select */}
            <select
              className="md:hidden bg-[#1565C0] text-white text-xs rounded px-2 py-1.5 border border-blue-400 focus:outline-none"
              value={institution} onChange={e=>{setInstitution(e.target.value);setCustomABG(null);}}>
              <option value="stanford">Stanford</option>
              <option value="mgh">Harvard MGH</option>
            </select>
            {/* Desktop: pill buttons */}
            <div className="hidden md:flex rounded overflow-hidden border border-blue-400 text-xs">
              {[{id:"stanford",label:"Stanford"},{id:"mgh",label:"Harvard MGH"}].map(opt=>(
                <button key={opt.id} onClick={()=>{setInstitution(opt.id);setCustomABG(null);}}
                  className={`px-3 py-1.5 font-medium transition-colors ${!customABG&&institution===opt.id?"bg-white text-[#1565C0]":"bg-[#1565C0] text-blue-200 hover:bg-[#1976D2]"}`}>
                  {opt.label}
                </button>
              ))}
              <label className={`px-3 py-1.5 font-medium cursor-pointer transition-colors ${customABG?"bg-white text-[#1565C0]":"bg-[#1565C0] text-blue-200 hover:bg-[#1976D2]"}`}>
                + Upload
                <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={e=>{
                  const f=e.target.files?.[0]; if(!f)return;
                  const r=new FileReader(); r.onload=ev=>{try{setCustomABG(JSON.parse(ev.target.result));}catch{alert("Invalid JSON");}};r.readAsText(f);
                }}/>
              </label>
            </div>
            {customABG&&<span className="text-xs bg-white text-[#1565C0] px-2 py-0.5 rounded font-semibold">Custom</span>}
          </div>
        </div>

        {/* Mobile stats sub-bar */}
        <div className="md:hidden flex items-center gap-3 mt-1.5 text-xs text-blue-200">
          <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-red-300 inline-block"></span>{stats.actionRequired} Action</span>
          <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-green-300 inline-block"></span>{stats.cleared} Cleared</span>
          <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-gray-300 inline-block"></span>{stats.pending} Pending</span>
        </div>
      </header>

      {/* Load-more banner */}
      {showLoadMore&&(
        <div className="bg-epic-sectionBg border-b border-[#BBDEFB] px-4 py-2 flex items-center justify-between flex-shrink-0 gap-2">
          <span className="text-xs sm:text-sm text-epic-dark font-medium">✓ All active cases resolved — {ALL_PATIENTS.length-batchIdx*BATCH_SIZE} more in queue</span>
          <button onClick={loadNextBatch} className="text-xs px-3 py-1.5 bg-[#1976D2] hover:bg-[#1565C0] text-white rounded font-semibold flex-shrink-0">
            Load Next {Math.min(BATCH_SIZE,ALL_PATIENTS.length-batchIdx*BATCH_SIZE)} →
          </button>
        </div>
      )}

      {/* ── Main content area ── */}
      <div className="flex flex-1 overflow-hidden">

        {/* Patient Queue — full width on mobile when mobilePane==="queue", sidebar on md+ */}
        <div className={`bg-white border-r border-[#BBDEFB] flex flex-col
          ${mobilePane==="queue"?"flex":"hidden"} md:flex
          w-full md:w-72 md:flex-shrink-0`}>
          {/* Filter pills — horizontal scroll on mobile */}
          <div className="px-2 py-2 border-b border-[#BBDEFB] bg-epic-sectionBg flex-shrink-0">
            <div className="flex gap-1 overflow-x-auto scrollbar-none pb-0.5">
              {[{id:"all",l:"All"},{id:"action",l:`Action (${stats.actionRequired})`},{id:"cleared",l:`Cleared (${stats.cleared})`},{id:"pending",l:"Pending"}].map(f=>(
                <button key={f.id} onClick={()=>setFilter(f.id)}
                  className={`text-xs px-2.5 py-1 rounded font-medium transition-colors whitespace-nowrap flex-shrink-0 ${filterStatus===f.id?"bg-[#1976D2] text-white":"bg-white text-gray-600 border border-gray-300 hover:border-[#1976D2] hover:text-[#1976D2]"}`}>
                  {f.l}
                </button>
              ))}
            </div>
          </div>
          <div className="flex-1 overflow-y-auto scrollbar-thin py-2">
            {filtered.length===0&&<div className="text-center text-sm text-gray-400 mt-8 px-4">No patients in this category</div>}
            {filtered.map(p=>(
              <PatientCard key={p.id} patient={p} isSelected={p.id===selectedId} onClick={()=>selectPatient(p.id)}/>
            ))}
          </div>
          <div className="p-2 border-t border-[#BBDEFB] bg-epic-sectionBg text-center text-xs text-gray-400">
            {patients.length} patients · Batch {batchIdx}/{Math.ceil(ALL_PATIENTS.length/BATCH_SIZE)}
          </div>
        </div>

        {/* Workspace — full width on mobile when mobilePane==="workspace", flex-1 on md+ */}
        <div className={`flex-1 overflow-hidden flex flex-col
          ${mobilePane==="workspace"?"flex":"hidden"} md:flex`}>
          {selectedPatient
            ? <PatientWorkspace key={selectedPatient.id} patient={selectedPatient} institution={institution} onAction={handleAction}/>
            : <div className="flex items-center justify-center h-full text-gray-400 bg-white">
                <div className="text-center px-6">
                  <div className="text-5xl mb-3">⚕</div>
                  <div className="text-lg font-medium">Select a patient to begin</div>
                  <div className="text-sm mt-1 text-gray-400">Use the queue to navigate patients</div>
                </div>
              </div>}
        </div>
      </div>

      {/* ── Mobile bottom tab bar (hidden on desktop) ── */}
      <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-[#BBDEFB] flex z-40 pb-safe shadow-lg">
        {/* Patients tab */}
        <button onClick={()=>setMobilePane("queue")}
          className={`flex-1 py-2.5 flex flex-col items-center gap-0.5 relative transition-colors ${mobilePane==="queue"?"text-[#1976D2]":"text-gray-500"}`}>
          {/* List icon */}
          <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
          </svg>
          <span className="text-xs font-medium">Patients</span>
          {stats.actionRequired>0&&(
            <span className="absolute top-1.5 left-1/2 ml-2 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center font-bold leading-none">
              {stats.actionRequired>9?"9+":stats.actionRequired}
            </span>
          )}
        </button>

        {/* Review tab */}
        <button onClick={()=>setMobilePane("workspace")} disabled={!selectedPatient}
          className={`flex-1 py-2.5 flex flex-col items-center gap-0.5 transition-colors ${mobilePane==="workspace"?"text-[#1976D2]":"text-gray-500"} disabled:opacity-40`}>
          {/* Chart icon */}
          <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          <span className="text-xs font-medium truncate max-w-[80px]">
            {selectedPatient?selectedPatient.name.last:"Review"}
          </span>
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
